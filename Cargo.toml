[package]
name = "nothingx-desktop"
version = "1.1.0"
edition = "2024"
description = "Lightweight native tray controls for Nothing and CMF headphones"
license = "AGPL-3.0-only"
repository = "https://github.com/nipunyatawara-dev/NothingX-Desktop"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = { version = "=0.25.1", default-features = false }
tao = { version = "=0.37.2", default-features = false, features = ["rwh_06"] }
wry = { version = "=0.57.2", default-features = false, features = ["os-webview"] }
window-vibrancy = "=0.8.1"
fs2 = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", features = ["NSColor", "NSColorSpace", "NSWindow", "NSView", "NSApplication"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Devices_Bluetooth", "Win32_Networking_WinSock", "Win32_System_Registry", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1.34"
